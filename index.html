<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>통역 정산 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: one ledger column. Header (year, add buttons) > tabs > summary tiles, monthly chart, monthly ledger, ratio cards; work tab mirrors the Excel sheet (first/second half bands with subtotals); lecture tab groups by institution. */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#ECF0EE; --ink:#15201E; --ink-2:#51605D; --line:#D8DFDC;
  --interp:#1B5E63; --lect:#5B52A3; --good:#2B7A4B; --warn:#A85D0A; --danger:#B3261E;
  --c1:#1B5E63; --c2:#5B52A3; --c3:#C07A12; --c4:#B8476B; --c5:#2F6FB3; --c6:#7C8B88;
  --side-bg:#10252A; --side-ink:#E3EEEC; --side-ink-2:#8FA8A5; --side-active:#1F3F44; --side-hover:#18343A;
  --on-accent:#FFFFFF; --hero-bg:#16302F; --hero-ink:#EAF4F2; --hero-ink-2:#9FBAB6; --scrim:rgba(10,20,19,.5);
  --display:'Noto Serif KR','Batang',serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1615; --surface:#172120; --surface-2:#1F2C2B; --ink:#E6EEEC; --ink-2:#9DB0AC; --line:#2A3A38;
    --interp:#55B5BA; --lect:#A39BEA; --good:#5BC48A; --warn:#E0A04A; --danger:#F2877F;
    --c1:#55B5BA; --c2:#A39BEA; --c3:#E0A04A; --c4:#E58AA8; --c5:#6FAEEA; --c6:#8FA09D;
    --side-bg:#0A1211; --side-ink:#E3EEEC; --side-ink-2:#8FA8A5; --side-active:#1B2D2C; --side-hover:#131F1E;
    --on-accent:#0B1413; --hero-bg:#1D3B39; --hero-ink:#EAF4F2; --hero-ink-2:#9FBAB6; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1615; --surface:#172120; --surface-2:#1F2C2B; --ink:#E6EEEC; --ink-2:#9DB0AC; --line:#2A3A38;
  --interp:#55B5BA; --lect:#A39BEA; --good:#5BC48A; --warn:#E0A04A; --danger:#F2877F;
  --c1:#55B5BA; --c2:#A39BEA; --c3:#E0A04A; --c4:#E58AA8; --c5:#6FAEEA; --c6:#8FA09D;
    --side-bg:#0A1211; --side-ink:#E3EEEC; --side-ink-2:#8FA8A5; --side-active:#1B2D2C; --side-hover:#131F1E;
    --on-accent:#0B1413; --hero-bg:#1D3B39; --hero-ink:#EAF4F2; --hero-ink-2:#9FBAB6; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;gap:22px;
  padding:22px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:17px;padding:0 8px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--interp);color:var(--on-accent);display:grid;place-items:center;font-family:var(--body);font-weight:600;flex:none}
.nav{display:flex;flex-direction:column;gap:4px}
.navb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:var(--side-ink-2);cursor:pointer;font-size:14px}
.navb svg{width:18px;height:18px;flex:none}
.navb:hover{background:var(--side-hover);color:var(--side-ink)}
.navb[aria-current=page]{background:var(--side-active);color:var(--side-ink);font-weight:600}
.navb:focus-visible{outline:2px solid var(--side-ink);outline-offset:-2px}
.side-foot{margin-top:auto;padding:0 8px;font-size:12px;color:var(--side-ink-2)}
.main{padding-block:26px 56px;padding-left:32px;padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;width:100%}
.top{margin-bottom:14px}
.years{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.ytab{padding:7px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;font-variant-numeric:tabular-nums}
.ytab:hover{background:var(--surface-2);color:var(--ink)}
.ytab[aria-selected=true]{background:var(--interp);border-color:var(--interp);color:var(--on-accent);font-weight:600}
.ytab.add{border-style:dashed;background:transparent}
.yadd{display:flex;gap:6px;align-items:center}
.yadd input{width:96px}
.ytab:focus-visible{outline:2px solid var(--interp);outline-offset:2px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{height:auto;flex-direction:row;align-items:center;gap:8px;z-index:10;padding:10px 12px;
    padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));overflow-x:auto}
  .brand .bt,.side-foot{display:none}
  .brand{padding:0}
  .nav{flex-direction:row;gap:2px}
  .navb{white-space:nowrap;padding:8px 12px;width:auto}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:18px}
}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-size:26px;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--ink-2)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,button,textarea{font:inherit;color:inherit}
select,input[type=text],input[type=date],input[type=number],input[type=search],textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
textarea{resize:vertical}
select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--interp);outline-offset:2px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pi{background:var(--interp);border-color:var(--interp);color:var(--on-accent);font-weight:500}
.btn.pl{background:var(--lect);border-color:var(--lect);color:var(--on-accent);font-weight:500}
.btn.pi:hover{background:var(--interp);filter:brightness(1.08)}
.btn.pl:hover{background:var(--lect);filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.stack{display:flex;flex-direction:column;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.tile .k{font-size:12px;color:var(--ink-2)}
.tile .v{font-family:var(--display);font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.3}
.tile .n{font-size:12px;color:var(--ink-2);margin-top:2px}
.tile.hero{background:var(--hero-bg);border-color:var(--hero-bg);color:var(--hero-ink)}
.tile.hero .k,.tile.hero .n{color:var(--hero-ink-2)}
.tile.hero .v{font-size:30px}
.u{font-family:var(--body);font-size:.55em;font-weight:500;margin-left:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
.cardhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline;margin-bottom:8px}
.cardhead h2{margin:0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mix{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:stretch}
@media (max-width:1100px){.mix{grid-template-columns:minmax(0,1fr)}}
.rcol{display:flex;flex-direction:column;gap:14px;min-width:0;width:100%}
.dcard{padding:12px 16px;container-type:inline-size}
.dcard h3{font-size:13.5px;font-weight:600;margin:0 0 8px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.dcard h3 span{font-weight:400;color:var(--ink-2);font-size:12px}
/* 도넛은 카드 너비에 비례해 커지고, 범례는 남는 폭을 막대로 채워서 어떤 해상도에서도 빈 공간이 생기지 않습니다. */
.dbody{display:grid;grid-template-columns:auto minmax(0,420px);justify-content:center;gap:clamp(16px,3cqw,36px);align-items:center}
.dbody svg{display:block;width:clamp(92px,13cqw,170px);height:auto;transform:translateX(calc(-1*max(0px,(100cqw - 32px - 420px - 16cqw)/6)))}
.dbody .empty{grid-column:1/-1}
.dcard .track{stroke:var(--surface-2)}
.dcard .dv{fill:var(--ink);font-family:var(--display);font-weight:700}
.dcard .ds{fill:var(--ink-2);font:10px var(--body)}
.lg{display:grid;grid-template-columns:10px minmax(0,max-content) minmax(28px,1fr) max-content max-content;max-width:420px;column-gap:10px;row-gap:9px;align-items:center;font-size:12.5px;min-width:0;width:100%}
.lg .sw{width:10px;height:10px;border-radius:2px}
.lg .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lg .bt{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:0}
.lg .bt i{display:block;height:100%;border-radius:4px}
.lg .sv{margin-left:8px;color:var(--ink-2);font-size:12px;text-align:right;white-space:nowrap}
.lg .pc{font-family:var(--mono);font-size:12.5px;text-align:right;white-space:nowrap;min-width:3.9em}
@container (max-width:470px){.lg{grid-template-columns:10px minmax(0,max-content) minmax(20px,1fr) max-content}.lg .sv{display:none}}
.vl{fill:var(--ink);font:500 10px var(--mono)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;text-align:left;color:var(--ink-2);font-weight:500;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th.num,td.num{text-align:right;white-space:nowrap;font-family:var(--mono);font-size:13px}
td.nw{white-space:nowrap}
td.nm{min-width:280px}
td.ag{white-space:nowrap;min-width:140px}
td.pt{white-space:nowrap;min-width:120px}
td.pre{white-space:pre-line;font-size:12.5px;min-width:120px}
td.tm{white-space:pre;font-size:12.5px;min-width:140px;font-family:var(--mono)}
tfoot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
tr.cur td{background:var(--surface-2)}
tr.band td{background:var(--surface-2);font-weight:600;font-size:13px;border-bottom:1px solid var(--line)}
tr.subt td{font-weight:600;border-bottom:2px solid var(--line)}
tr.subt td.lab{text-align:right;color:var(--ink-2)}
.mut{color:var(--ink-2);font-size:12px}
.dim{color:var(--ink-2)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap;line-height:1.6}
.pill.sim{background:var(--interp);border-color:var(--interp);color:var(--on-accent)}
.pill.con{background:transparent;border-color:var(--interp);color:var(--interp)}
.pill.tr{background:transparent;border-color:var(--lect);color:var(--lect)}
button.pill{cursor:pointer;font-family:inherit}
.st0{color:var(--warn);border-color:var(--warn);background:transparent}
.st1{color:var(--good);border-color:var(--good);background:transparent}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters input[type=search]{flex:1 1 200px}
.acts{display:flex;gap:10px;white-space:nowrap;align-items:center}
.status-actions{justify-content:space-between;gap:12px;min-width:0;width:100%;padding-right:0}
/* 업무 내역: 모든 연도에서 동일한 열 비율을 유지하면서 화면 너비를 채움 */
#interp-table table{width:100%;table-layout:fixed}
#interp-table th,#interp-table td{min-width:0;box-sizing:border-box}
#interp-table th{white-space:normal;overflow-wrap:anywhere}
#interp-table td.nm,#interp-table td.ag,#interp-table td.pt,#interp-table td.pre{white-space:normal;overflow-wrap:anywhere;word-break:normal}
#interp-table td.nm{min-width:0}
#interp-table td.ag{min-width:0}
#interp-table td.pt{min-width:0}
#interp-table td.pre{min-width:0}
#interp-table td.tm{min-width:0;white-space:pre-line;overflow-wrap:anywhere}
#interp-table td.nw,#interp-table td.num{white-space:nowrap}
#interp-table td:last-child,#interp-table th:last-child{min-width:0}
#interp-table td:last-child{white-space:nowrap}
#interp-table td:last-child .status-actions{width:100%;box-sizing:border-box;justify-content:space-between;gap:6px}
#interp-table .status-actions .acts{gap:5px}
#interp-table .status-actions .btn{padding-left:7px;padding-right:7px}
@media(max-width:1200px){#interp-table table{min-width:1050px}}
.status-actions .acts{gap:8px}
.empty{color:var(--ink-2);padding:20px 4px;text-align:center}
.banner{border:1px dashed var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.banner.err{border-color:var(--danger);color:var(--danger)}
.row{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--interp);border-radius:4px}
.bar i.dim2{opacity:.55}
.bar i.l{background:var(--lect)}
.row .val{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
.row .lab{overflow-wrap:anywhere}
.heads{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.heads .t{font-family:var(--display);font-size:18px;font-weight:700}
.heads .tot{font-family:var(--mono);font-size:15px;font-weight:500}
svg.chart{display:block;width:100%;height:auto}
.gl{stroke:var(--line);stroke-width:1}
.b-i{fill:var(--interp)}.b-l{fill:var(--lect)}
.tk{fill:var(--ink-2);font:11px var(--mono)}
.tk.cur{fill:var(--ink);font-weight:500}
.pk{fill:var(--ink);font:500 11px var(--mono)}
.ov{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;
  padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:12px;width:100%;max-width:700px;padding:20px;border:1px solid var(--line)}
.sheet h2{font-family:var(--display);font-size:19px;margin-bottom:14px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);min-width:0}
.fg label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13px}
.fg .full{grid-column:1/-1}
.fg input[type=text],.fg input[type=date],.fg input[type=number],.fg select,.fg textarea{width:100%;color:var(--ink)}
.fbar{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:16px;flex-wrap:wrap}
.ferr{color:var(--danger);margin-right:auto;font-size:13px}
.hint{font-size:12px;color:var(--ink-2)}
@media (max-width:560px){
  .fg{grid-template-columns:1fr}
  .fg input,.fg select,.fg textarea,.filters select,.filters input{font-size:16px}
  h1{font-size:22px}
  .tile.hero .v{font-size:26px}
}
@media (prefers-reduced-motion:no-preference){.btn,.navb{transition:background .12s,color .12s}}
.u2{font-family:var(--body);font-size:11px;color:var(--ink-2);margin-left:2px}
/* Financial columns use the same font as other table cells. */
th.money-col{font-family:var(--body);font-size:12px}
td.money-col{font-family:var(--body);font-size:14px}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo" aria-hidden="true">₩</span><span class="bt">통역 정산</span></div>
    <nav class="nav" aria-label="메뉴">
      <button class="navb" data-act="tab" data-tab="summary" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>대시보드</button>
      <button class="navb" data-act="tab" data-tab="interp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>업무 내역</button>
      <button class="navb" data-act="tab" data-tab="lect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M8 7h8M8 11h6"/></svg>강의 내역</button>
      <button class="navb" data-act="tab" data-tab="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 4 4 7M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"/></svg>데이터·백업</button>
    </nav>
    <div class="side-foot">입력한 내역은 이 브라우저에만 저장됩니다.</div>
  </aside>

<main class="main">
  <div class="top">
    <div>
      <h1 id="page-title">업무·수입 요약</h1>
      <p class="sub" id="page-sub">업무와 강의 수입을 한눈에 확인하세요.</p>
    </div>
    <div class="ctl">
      <button class="btn pi" data-act="add-i" id="add-i">+ 업무 추가</button>
      <button class="btn pl" data-act="add-l" id="add-l">+ 강의 추가</button>
    </div>
  </div>

  <div class="years" id="years" role="tablist" aria-label="연도"></div>

  <div id="banner"></div>

  <section id="p-summary" class="stack">
    <div class="tiles" id="tiles"></div>
    <div class="mix">
      <div class="card">
        <div class="cardhead"><h2 id="chart-title">월별 수입</h2>
          <div class="legend"><span><i style="background:var(--interp)"></i>업무(통역·번역)</span><span><i style="background:var(--lect)"></i>강의</span></div>
        </div>
        <div id="chart"></div>
        <p class="hint" id="chart-note" hidden></p>
      </div>
      <div class="rcol" id="rcol"></div>
    </div>
    <div class="card">
      <h2>월별 정산표</h2>
      <div class="tbl-wrap" id="monthly"></div>
    </div>
  </section>

  <section id="p-interp" hidden>
    <div class="heads"><span class="t" id="i-title"></span><span class="tot" id="i-total"></span></div>
    <div class="filters">
      <select id="i-month" aria-label="월"><option value="all">전체 월</option></select>
      <select id="i-mode" aria-label="업무"><option value="all">업무 전체</option><option>동시</option><option>순차</option><option>번역</option></select>
      <select id="i-status" aria-label="정산 상태"><option value="all">정산·미정산 전체</option><option>미정산</option><option>정산</option></select>
      <input type="search" id="i-q" placeholder="에이전시, 행사명, 파트너, 비고 검색">
    </div>
    <div class="card"><div class="tbl-wrap" id="interp-table"></div></div>
  </section>

  <section id="p-lect" hidden class="stack">
    <div class="tiles" id="l-tiles"></div>
    <div class="filters">
      <select id="l-month" aria-label="월"><option value="all">전체 월</option></select>
      <select id="l-status" aria-label="정산 상태"><option value="all">정산·미정산 전체</option><option>미정산</option><option>정산</option></select>
      <input type="search" id="l-q" placeholder="강의명, 기관 검색">
    </div>
    <div class="card"><div class="tbl-wrap" id="lect-table"></div></div>
  </section>

  <section class="card" id="p-data" hidden>
    <h2>데이터 관리</h2>
    <p class="hint" style="margin:0 0 10px">입력한 내역은 이 브라우저에만 저장됩니다. 사이트 데이터를 지우거나 다른 기기에서 열면 보이지 않으니, 주기적으로 백업 파일을 저장해 두세요.</p>
    <div class="ctl">
      <button class="btn" data-act="backup">백업 저장 (JSON)</button>
      <button class="btn" data-act="restore">백업 불러오기</button>
      <button class="btn" data-act="export-i">업무 내역 CSV</button>
      <button class="btn" data-act="export-l">강의료 CSV</button>
      <input type="file" id="restore-file" accept=".json,application/json" hidden>
    </div>
  </section>

<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<datalist id="dl-agency"></datalist>
<datalist id="dl-org"></datalist>

<script>
(function(){
  var state={year:new Date().getFullYear(),tab:'summary',interp:[],lect:[],meta:{},del:null,form:null,pendingRestore:null,restoreErr:false,addingYear:false,yearErr:''};
  var KEY='interpreter-settlement-public-v4',OLD_KEY='interpreter-settlement-v2',canStore=true;
  var ST=['미정산','정산'];
  var RATE_COMM=0.15,RATE_TAX=0.033;
  var WD='일월화수목금토';
  var nf=new Intl.NumberFormat('ko-KR');
  function $(id){return document.getElementById(id)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function num(v){var n=Number(v);return isFinite(n)?n:0}
  function won(n){return nf.format(Math.round(n))}
  function wonU(n){return won(n)+'<span class="u">원</span>'}
  function wonS(n){return won(n)+'<span class="u2">원</span>'}
  function settled(r){return r.status==='정산'}
  function dash(n,f){return n?f(n):'<span class="dim">–</span>'}
  function short(n){if(n>=1e8)return (n/1e8).toFixed(1).replace(/\.0$/,'')+'억';if(n>=1e4)return nf.format(Math.round(n/1e4))+'만';return String(n)}
  function pct(a,b){return b>0?(a/b*100).toFixed(2)+'%':'0.00%'}
  function md(d){return d.slice(5,7)+'.'+d.slice(8,10)}
  function fmtRange(a,b){
    if(!a)return '';
    if(a.slice(5,7)==='00')return '월 미지정';
    if(b&&b!==a)return md(a)+' ~ '+md(b);
    var dt=new Date(a+'T00:00:00');return md(a)+' ('+WD[dt.getDay()]+')';
  }
  function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function byDateAsc(a,b){return (a.date||'').localeCompare(b.date||'')}
  function inYear(r){return (r.date||'').indexOf(String(state.year))===0}
  function sum(list,f){return list.reduce(function(s,r){return s+num(r[f])},0)}
  function monthOf(r){return +(r.date||'').slice(5,7)}

  /* ---------- storage ---------- */
  function persist(){try{localStorage.setItem(KEY,JSON.stringify({interp:state.interp,lect:state.lect,meta:state.meta}));canStore=true}catch(e){canStore=false}}
  function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&Array.isArray(o.interp)&&Array.isArray(o.lect))return o}}catch(e){canStore=false}return null}

  /* 엑셀 파일(2024·2025년 업무 내역)에서 옮겨 온 내역. 버전이 오르면 새 내역만 한 번 추가됩니다. */
  var PRELOAD_V=2;
  var PRELOAD={"interp":[],"lect":[]};
  /* 버전이 오를 때 이미 저장된 내역에 반영할 보정값. 비어 있는 칸만 채우고 직접 고친 값은 건드리지 않습니다. */
  var PATCHES=[{v:2,items:[{"id":"p24-18","set":{"dateEnd":"2024-06-16"}},{"id":"p24-32","set":{"dateEnd":"2024-10-31"}},{"id":"p24-35","set":{"dateEnd":"2024-11-30"}}]}];
  function applyPreload(){
    var cur=state.meta.preload||0;
    if(cur>=PRELOAD_V)return;
    if(cur===0){
      var have={};state.interp.concat(state.lect).forEach(function(r){have[r.id]=1});
      PRELOAD.interp.forEach(function(r){if(!have[r.id])state.interp.push(Object.assign({},r))});
      PRELOAD.lect.forEach(function(r){if(!have[r.id])state.lect.push(Object.assign({},r))});
    }else{
      PATCHES.forEach(function(pt){
        if(pt.v<=cur)return;
        pt.items.forEach(function(it){
          var rec=state.interp.concat(state.lect).filter(function(r){return r.id===it.id})[0];
          if(!rec)return;
          Object.keys(it.set).forEach(function(k){if(rec[k]===''||rec[k]==null)rec[k]=it.set[k]});
        });
      });
    }
    state.meta.preload=PRELOAD_V;persist();
  }

  /* ---------- files ---------- */
  function download(name,text,type){
    var b=new Blob([text],{type:type}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},1500);
  }
  function csvCell(v){v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
  function exportCsv(kind){
    var rows=(kind==='i'?state.interp:state.lect).slice().sort(byDateAsc),head,keys;
    if(kind==='i'){head=['일자','종료일','에이전시','행사명','업무','파트너','시간','공급가액','수수료','감수료','공제 후 금액','비고','장소','주제','정산'];keys=['date','dateEnd','agency','name','mode','partner','time','gross','comm','rev','net','note','venue','topic','status']}
    else{head=['일자','기관','강의명','시수','시간당 강의료','강의료','정산','메모'];keys=['date','org','name','hours','rate','fee','status','memo']}
    var lines=[head.map(csvCell).join(',')];
    rows.forEach(function(r){lines.push(keys.map(function(k){return csvCell(r[k])}).join(','))});
    download((kind==='i'?'업무내역_':'강의료_')+todayStr()+'.csv','﻿'+lines.join('\r\n'),'text/csv;charset=utf-8');
  }
  function backup(){download('통역정산_백업_'+todayStr()+'.json',JSON.stringify({version:2,exportedAt:new Date().toISOString(),interp:state.interp,lect:state.lect,meta:state.meta},null,1),'application/json')}
  function readBackup(file){
    var rd=new FileReader();
    rd.onload=function(){
      try{var o=JSON.parse(String(rd.result));if(!o||!Array.isArray(o.interp)||!Array.isArray(o.lect)||o.version!==2)throw new Error('x');state.pendingRestore=o;state.restoreErr=false}
      catch(e){state.pendingRestore=null;state.restoreErr=true}
      renderBanner();
    };
    rd.readAsText(file);
  }
  function applyRestore(){
    var p=state.pendingRestore;if(!p)return;
    function fix(list){return list.map(function(r,i){r=Object.assign({},r);if(!r.id)r.id=uid()+i;return r})}
    state.interp=fix(p.interp);state.lect=fix(p.lect);state.meta=p.meta||{};state.pendingRestore=null;
    pickYear();persist();renderAll();
  }

  /* ---------- aggregates ---------- */
  function monthly(){
    var m=[];for(var i=0;i<12;i++)m.push({ni:0,gi:0,fi:0,nl:0,fl:0});
    var un=0;
    state.interp.filter(inYear).forEach(function(r){var k=monthOf(r)-1;if(k>=0&&k<12&&r.status==='정산'){m[k].ni++;m[k].gi+=num(r.gross);m[k].fi+=num(r.net)}});
    state.lect.filter(inYear).forEach(function(r){var k=monthOf(r)-1;if(k>=0&&k<12){m[k].nl++;if(r.status==='정산')m[k].fl+=num(r.fee)}else if(r.status==='정산')un+=num(r.fee)});
    m.un=un;return m;
  }
  function totals(list){return {g:sum(list,'gross'),c:sum(list,'comm'),r:sum(list,'rev'),n:sum(list,'net')}}

  /* ---------- summary ---------- */
  function renderTiles(){
    var yi=state.interp.filter(inYear),yl=state.lect.filter(inYear);
    var yiPaid=yi.filter(settled),ylPaid=yl.filter(settled);
    var ti=sum(yi.filter(function(r){return r.status==='정산'}),'net'),tl=sum(yl.filter(function(r){return r.status==='정산'}),'fee');
    var pend=yi.filter(function(r){return r.status!=='정산'}).map(function(r){return num(r.net)}).concat(yl.filter(function(r){return r.status!=='정산'}).map(function(r){return num(r.fee)}));
    var pendSum=pend.reduce(function(a,b){return a+b},0);
    $('tiles').innerHTML=
      '<div class="tile hero"><div class="k">'+state.year+'년 총수입</div><div class="v">'+wonU(ti+tl)+'</div><div class="n">업무 + 강의, 공제 후 금액 기준</div></div>'+
      '<div class="tile"><div class="k">업무 총계 (통역·번역)</div><div class="v">'+wonU(ti)+'</div><div class="n">정산 '+yiPaid.length+'건 · 공급가액 '+won(sum(yiPaid,'gross'))+'원</div></div>'+
      '<div class="tile"><div class="k">강의료</div><div class="v">'+wonU(tl)+'</div><div class="n">정산 '+ylPaid.length+'건</div></div>'+
      '<div class="tile"><div class="k">미정산</div><div class="v">'+wonU(pendSum)+'</div><div class="n">'+pend.filter(function(x){return true}).length+'건 중 정산 전 금액</div></div>';
    var cnt=yi.filter(function(r){return r.status!=='정산'}).length+yl.filter(function(r){return r.status!=='정산'}).length;
    $('tiles').lastChild.querySelector('.n').textContent=cnt+'건';
  }

  function chartH(hasNote){
    var rc=$('rcol'),h=240;
    try{
      if(rc&&rc.children.length&&window.matchMedia&&window.matchMedia('(min-width:1101px)').matches){
        var nat=0;Array.prototype.forEach.call(rc.children,function(c){nat+=c.offsetHeight});
        nat+=14*(rc.children.length-1);
        if(nat>0)h=Math.max(240,Math.min(560,nat-32-40-(hasNote?44:0)));
      }
    }catch(e){}
    return h;
  }
  function renderChart(){
    $('chart-title').textContent=state.year+'년 월별 수입';
    var m=monthly(),tot=m.map(function(x){return x.fi+x.fl}),mx=Math.max.apply(null,tot);
    var box=$('chart'),note=$('chart-note');
    if(m.un>0){note.hidden=false;note.textContent='월 미지정 강의료 '+won(m.un)+'원은 그래프에 없고 연간 합계에만 포함됩니다.'}else note.hidden=true;
    if(mx<=0){box.innerHTML='<p class="empty">'+state.year+'년에 월별로 기록된 수입이 없습니다.</p>';return}
    var W=Math.max(300,box.clientWidth||620),H=chartH(m.un>0),L=54,R=6,T=18,B=24,pw=W-L-R,ph=H-T-B;
    var steps=[1e5,2e5,5e5,1e6,2e6,3e6,5e6,1e7,2e7,5e7,1e8],step=1e8;
    for(var s=0;s<steps.length;s++){if(mx/steps[s]<=5){step=steps[s];break}}
    var top=Math.ceil(mx/step)*step,n=top/step;
    function y(v){return T+ph-(v/top)*ph}
    var out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="월별 수입 막대 그래프">';
    for(var g=0;g<=n;g++){var v=g*step,yy=y(v);
      out+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text class="tk" x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end">'+short(v)+'</text>';}
    var band=pw/12,bw=Math.min(40,band*.6),curM=(state.year===new Date().getFullYear())?new Date().getMonth():-1;
    function lab(v){return String(Math.max(1,Math.round(v/1e4)))+'만'}
    for(var i=0;i<12;i++){
      var x=L+i*band+(band-bw)/2,hi=ph*m[i].fi/top,hl=ph*m[i].fl/top;
      var tip=(i+1)+'월 합계 '+won(tot[i])+'원 (업무 '+won(m[i].fi)+' / 강의 '+won(m[i].fl)+')';
      out+='<g><title>'+esc(tip)+'</title>';
      if(hi>0)out+='<rect class="b-i" x="'+x+'" y="'+(T+ph-hi)+'" width="'+bw+'" height="'+hi+'"/>';
      if(hl>0)out+='<rect class="b-l" x="'+x+'" y="'+(T+ph-hi-hl)+'" width="'+bw+'" height="'+hl+'"/>';
      if(tot[i]>0)out+='<text class="vl" x="'+(L+i*band+band/2)+'" y="'+(y(tot[i])-4)+'" text-anchor="middle">'+lab(tot[i])+'</text>';
      out+='<rect x="'+(L+i*band)+'" y="'+T+'" width="'+band+'" height="'+ph+'" fill="transparent"/></g>';
      out+='<text class="tk'+(i===curM?' cur':'')+'" x="'+(L+i*band+band/2)+'" y="'+(H-8)+'" text-anchor="middle">'+(band<34?(i+1):(i+1)+'월')+'</text>';
    }
    out+='</svg>';
    box.innerHTML=out;
  }

  function renderMonthly(){
    var m=monthly(),curM=(state.year===new Date().getFullYear())?new Date().getMonth():-1,cum=0;
    var tn=0,tg=0,tf=0,tl=0;
    var h='<table><thead><tr><th>월</th><th class="num">정산 건수</th><th class="num">공급가액</th><th class="num">업무 정산액</th><th class="num">강의료</th><th class="num">월 합계</th><th class="num">누계</th></tr></thead><tbody>';
    for(var i=0;i<12;i++){
      var x=m[i],t=x.fi+x.fl;cum+=t;tn+=x.ni;tg+=x.gi;tf+=x.fi;tl+=x.fl;
      h+='<tr'+(i===curM?' class="cur"':'')+'><td class="nw">'+(i+1)+'월</td><td class="num">'+dash(x.ni,String)+'</td><td class="num">'+dash(x.gi,wonS)+'</td><td class="num">'+dash(x.fi,wonS)+'</td><td class="num">'+dash(x.fl,wonS)+'</td><td class="num">'+dash(t,wonS)+'</td><td class="num">'+dash(cum,wonS)+'</td></tr>';
    }
    if(m.un>0){h+='<tr><td class="nw">월 미지정</td><td class="num"><span class="dim">–</span></td><td class="num"><span class="dim">–</span></td><td class="num"><span class="dim">–</span></td><td class="num">'+wonS(m.un)+'</td><td class="num">'+wonS(m.un)+'</td><td class="num"></td></tr>'}
    h+='</tbody><tfoot><tr><td>연간</td><td class="num">'+tn+'</td><td class="num">'+wonS(tg)+'</td><td class="num">'+wonS(tf)+'</td><td class="num">'+wonS(tl+m.un)+'</td><td class="num">'+wonS(tf+tl+m.un)+'</td><td class="num"></td></tr></tfoot></table>';
    $('monthly').innerHTML=h;
  }

  function donut(slices,top,sub,label){
    var tot=slices.reduce(function(a,x){return a+x.v},0);
    if(tot<=0)return '<p class="empty">내역 없음</p>';
    var R=46,C=2*Math.PI*R,live=slices.filter(function(x){return x.v>0}),gap=live.length>1?1.6:0,cum=0;
    var out='<svg viewBox="0 0 120 120" role="img" aria-label="'+esc(label)+'"><circle class="track" cx="60" cy="60" r="'+R+'" fill="none" stroke-width="16"/>';
    live.forEach(function(x){
      var f=x.v/tot,len=Math.max(f*C-gap,0.01);
      out+='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+x.color+'" stroke-width="16" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-cum*C)+'" transform="rotate(-90 60 60)"><title>'+esc(x.label+' '+pct(x.v,tot)+' · '+x.tip)+'</title></circle>';
      cum+=f;
    });
    out+='<text class="dv" x="60" y="61" text-anchor="middle" style="font-size:'+(String(top).length>4?13:17)+'px">'+esc(top)+'</text><text class="ds" x="60" y="76" text-anchor="middle">'+esc(sub)+'</text></svg>';
    var mx=Math.max.apply(null,live.map(function(x){return x.v}));
    out+='<div class="lg">'+live.map(function(x){
      var tt=esc(x.label+' · '+x.tip);
      return '<i class="sw" style="background:'+x.color+'"></i>'+
        '<span class="nm" title="'+tt+'">'+esc(x.label)+'</span>'+
        '<span class="bt" aria-hidden="true" title="'+tt+'"><i style="width:'+(x.v/mx*100).toFixed(1)+'%;background:'+x.color+'"></i></span>'+
        '<span class="sv">'+esc(x.sv||'')+'</span>'+
        '<span class="pc" title="'+tt+'">'+pct(x.v,tot)+'</span>';
    }).join('')+'</div>';
    return out;
  }
  function dnBlock(title,basis,html){return '<div class="card dcard"><h3>'+title+'<span>'+basis+'</span></h3><div class="dbody">'+html+'</div></div>'}
  function renderBreakdowns(){
    var yi=state.interp.filter(inYear),box=$('rcol');
    if(!yi.length){box.innerHTML='<div class="card"><p class="empty">'+state.year+'년 업무 내역이 없습니다.</p></div>';return}
    function tip(list){var paid=list.filter(function(r){return r.status==='정산'});return list.length+'건 · 정산 '+won(sum(paid,'net'))+'원'}
    var tong=yi.filter(function(r){return r.mode!=='번역'}),tr=yi.filter(function(r){return r.mode==='번역'});
    var sim=tong.filter(function(r){return r.mode==='동시'}),seq=tong.filter(function(r){return r.mode==='순차'});
    var h=dnBlock('통역 / 번역','건수 기준',donut([{label:'통역',v:tong.length,color:'var(--c1)',tip:tip(tong),sv:tong.length+'건'},{label:'번역',v:tr.length,color:'var(--c2)',tip:tip(tr),sv:tr.length+'건'}],String(yi.length),'건','통역과 번역 비율'));
    h+=dnBlock('통역별','동시·순차, 건수 기준',donut([{label:'동시',v:sim.length,color:'var(--c1)',tip:tip(sim),sv:sim.length+'건'},{label:'순차',v:seq.length,color:'var(--c3)',tip:tip(seq),sv:seq.length+'건'}],String(tong.length),'건','동시통역과 순차통역 비율'));
    var g={};yi.forEach(function(r){var k=(r.agency||'').trim()||'(미기재)';g[k]=g[k]||[];g[k].push(r)});
    var arr=Object.keys(g).map(function(k){var paid=g[k].filter(function(r){return r.status==='정산'});return {k:k,list:g[k],f:sum(paid,'net')}}).sort(function(a,b){return b.f-a.f});
    var cols=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'],sl=arr.slice(0,5).map(function(o,i){return {label:o.k,v:o.f,color:cols[i],tip:tip(o.list),sv:short(o.f)+'원'}}).filter(function(o){return o.v>0});
    var rest=arr.slice(5);

      if(!data.date)err='일자를 입력하세요.';
      else if(data.dateEnd&&data.dateEnd<data.date)err='종료일이 시작일보다 앞섭니다.';
      else if(!data.name)err='행사명을 입력하세요.';
      else if(data.net<=0&&num(data.gross)<=0)err='공급가액이나 공제 후 금액을 입력하세요.';
    }else{
      var yo=$('f-yo').checked,yr=g('f-year');
      data={date:yo?(/^\d{4}$/.test(yr)?yr+'-00-00':''):g('f-date'),org:g('f-org'),name:g('f-name'),hours:g('f-hours')===''?null:num(g('f-hours')),rate:g('f-rate')===''?null:num(g('f-rate')),fee:num(g('f-fee')),memo:g('f-memo'),status:g('f-status')};
      if(!data.date)err=yo?'연도를 4자리로 입력하세요.':'일자를 입력하세요.';
      else if(!data.org)err='기관을 입력하세요.';
      else if(!data.name)err='강의명을 입력하세요.';
      else if(data.fee<=0)err='강의료를 입력하세요.';
    }
    if(err){$('f-err').textContent=err;return}
    var list=f.kind==='i'?state.interp:state.lect;
    if(f.id){for(var k=0;k<list.length;k++){if(list[k].id===f.id){data.id=f.id;list[k]=data;break}}}
    else{data.id=uid();list.push(data)}
    persist();
    state.year=+data.date.slice(0,4)||state.year;
    closeForm();renderAll();
  }

  /* ---------- actions ---------- */
  function cycle(kind,id){
    var r=(kind==='i'?state.interp:state.lect).filter(function(x){return x.id===id})[0];if(!r)return;
    r.status=r.status==='정산'?'미정산':'정산';persist();renderAll();
  }
  function delDoc(){
    var d=state.del;if(!d)return;
    if(d.kind==='i')state.interp=state.interp.filter(function(r){return r.id!==d.id});
    else state.lect=state.lect.filter(function(r){return r.id!==d.id});
    state.del=null;persist();renderAll();
  }
  document.addEventListener('click',function(ev){
    var el=ev.target.closest('[data-act]');if(!el)return;
    var a=el.dataset.act;
    if(a==='tab')setTab(el.dataset.tab);
    else if(a==='add-i')openForm('i');
    else if(a==='add-l')openForm('l');
    else if(a==='add-scheduled'){var sm=String(el.dataset.month).padStart(2,'0');openForm('l',null,{org:el.dataset.org,date:state.year+'-'+sm+'-01',name:el.dataset.org+' '+sm+'월 강의료',status:'미정산',fee:null});}
    else if(a==='edit')openForm(el.dataset.kind,el.dataset.id);
    else if(a==='del'){state.del={kind:el.dataset.kind,id:el.dataset.id};renderInterp();renderLect()}
    else if(a==='del-no'){state.del=null;renderInterp();renderLect()}
    else if(a==='del-yes')delDoc();
    else if(a==='cycle')cycle(el.dataset.kind,el.dataset.id);
    else if(a==='close')closeForm();
    else if(a==='save')save();
    else if(a==='year'){state.year=+el.dataset.y;renderAll()}
    else if(a==='year-new'){state.addingYear=true;state.yearErr='';renderYear()}
    else if(a==='year-cancel'){state.addingYear=false;state.yearErr='';renderYear()}
    else if(a==='year-add')addYear();
    else if(a==='export-i')exportCsv('i');
    else if(a==='export-l')exportCsv('l');
    else if(a==='backup')backup();
    else if(a==='restore')$('restore-file').click();
    else if(a==='restore-yes')applyRestore();
    else if(a==='restore-no'){state.pendingRestore=null;state.restoreErr=false;renderBanner()}
  });
  $('ov').addEventListener('mousedown',function(ev){if(ev.target===$('ov'))closeForm()});
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&state.form)closeForm()});
  $('sheet').addEventListener('input',function(ev){
    var f=state.form;if(!f)return;var id=ev.target.id;
    if(id==='f-comm'){f.commTouched=ev.target.value!=='';autoCalc();return}
    if(id==='f-net'){f.netTouched=ev.target.value!=='';return}
    if(id==='f-fee'){f.feeTouched=ev.target.value!=='';return}
    if(id==='f-gross'||id==='f-rev'||id==='f-hours'||id==='f-rate')autoCalc();
  });
  $('sheet').addEventListener('change',function(ev){
    if(ev.target.id==='f-yo'){var on=ev.target.checked;$('w-date').hidden=on;$('w-year').hidden=!on}
  });
  function addYear(){
    var v=$('y-new')?$('y-new').value.trim():'',y=+v;
    if(!/^\d{4}$/.test(v)||y<2000||y>2100){state.yearErr='2000~2100 사이 연도를 4자리로 입력하세요.';renderYear();return}
    state.meta.years=(state.meta.years||[]).filter(function(x){return x!==y}).concat([y]);
    state.year=y;state.addingYear=false;state.yearErr='';persist();renderAll();
  }
  $('years').addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target.id==='y-new'){ev.preventDefault();addYear()}if(ev.key==='Escape'&&state.addingYear){state.addingYear=false;state.yearErr='';renderYear()}});
  $('restore-file').addEventListener('change',function(ev){var f=ev.target.files&&ev.target.files[0];if(f)readBackup(f);ev.target.value=''});
  ['i-month','i-mode','i-status','i-q'].forEach(function(id){$(id).addEventListener('input',renderInterp)});
  ['l-month','l-status','l-q'].forEach(function(id){$(id).addEventListener('input',renderLect)});
  var mopts='';for(var mi=1;mi<=12;mi++)mopts+='<option value="'+String(mi).padStart(2,'0')+'">'+mi+'월</option>';
  $('i-month').insertAdjacentHTML('beforeend',mopts);$('l-month').insertAdjacentHTML('beforeend',mopts);
  var rz=null;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){if(state.tab==='summary')renderChart()},150)});

  /* ---------- boot ---------- */
  // 2025년부터 기관명 KUMU를 KUMQ로 표준화합니다.
  function migrateLectureOrgNames(){
    state.lect.forEach(function(r){
      var y=+(r.date||'').slice(0,4);
      if(y>=2025 && String(r.org||'').trim().toUpperCase()==='KUMU')r.org='KUMQ';
    });
  }
  try{localStorage.removeItem(OLD_KEY)}catch(e){}
  var o=load();
  if(o){state.interp=o.interp;state.lect=o.lect;state.meta=o.meta||{}}
  else{state.interp=[];state.lect=[];state.meta={};persist()}
  // 배포용: 개인 업무 데이터는 미리 넣지 않습니다. 각 사용자가 직접 입력합니다.
  migrateLectureOrgNames();
  pickYear();
  renderAll();
})();
</script>
</body>
</html>
